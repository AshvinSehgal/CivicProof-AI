[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "civicproof-ai"
version = "0.1.0"
description = "Multimodal incident intelligence for municipal public works"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
  "alembic>=1.19.0",
  "geoalchemy2>=0.20.0",
  "pgvector>=0.5.0",
]

[project.optional-dependencies]
ai = [
  "langchain>=0.3,<1",
  "langgraph>=0.6,<1",
  "sentence-transformers>=5,<6",
  "transformers>=4.54,<5",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/civicproof"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["civicproof"]

[dependency-groups]
dev = [
    "accelerate>=1.14.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "transformers>=4.57.6",
    "xgboost>=3.3.0",
]
