services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: civicproof-postgres:pg16
    environment:
      POSTGRES_DB: civicproof
      POSTGRES_USER: civicproof
      POSTGRES_PASSWORD: civicproof
    ports:
      - "5432:5432"
    volumes:
      - civicproof_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  civicproof_postgres:
